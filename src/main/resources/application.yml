spring:
  application:
    name: robotmc-installer
  main:
    web-application-type: none

installer:
  update:
    # https 면 시작 시 원격 YAML로 installer 구성을 바꾼다. 비어 있으면 이 파일을 쓴다.
    # 원격 파일의 manifest-url 은 무시한다.
    # update.app 은 version 과 windows, macos, linux 각각의 url, sha256 이다. 이 파일에는 그 값을 넣지 않는다.
    manifest-url: 'https://raw.githubusercontent.com/robot-server/robotmc-installer/refs/heads/main/src/main/resources/application.yml'
  # 런처에 보이는 이름, 프로필 키, 버전 id, 게임 폴더, 내장 아이콘. 비어 있으면 아래 기본값.
  profile-name: RobotMC
  profile-key: robotmc
  version-id: RobotMC
  game-directory-name: robotmc
  profile-icon: Redstone_Block
  minecraft:
    version: 1.21.11
  mod:
    loader:
      type: neo_forge
      version: 21.11.6-beta
      install-options:
        - '--install-client'
    mods:
      - download-url: 'https://cdn.modrinth.com/data/YL57xq9U/versions/Gbr8rEDk/iris-neoforge-1.10.2+mc1.21.11.jar'
      - download-url: 'https://cdn.modrinth.com/data/lfHFW1mp/versions/LU6sozZq/journeymap-neoforge-1.21.11-6.0.0-beta.53.jar'
      - download-url: 'https://cdn.modrinth.com/data/AANobbMI/versions/k5Rs4Eru/sodium-neoforge-0.8.0+mc1.21.11.jar'
  servers:
    - ip: minecraft.o-r.cc
      name: Robot Server
  resource-packs:
    - download-url: 'https://cdn.modrinth.com/data/r4GILswZ/versions/vyty9ijM/Faithful 64x - December 2025 Release.zip'
