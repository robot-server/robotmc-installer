spring:
  application:
    name: robotmc-installer
  main:
    web-application-type: none

installer:
  update:
    # https 면 시작 시 원격 YAML로 installer 구성을 바꾼다. 비어 있으면 이 파일을 쓴다.
    # 원격 파일의 manifest-url 은 무시한다.
    # update.app 은 version 과 windows, macos, linux 각각의 url, sha256 이다. 이 파일에는 그 값을 넣지 않는다.
    manifest-url: 'https://raw.githubusercontent.com/robot-server/robotmc-installer/refs/heads/main/src/main/resources/application.yml'
  # 런처에 보이는 이름, 프로필 키, 버전 id, 게임 폴더, 내장 아이콘. 비어 있으면 아래 기본값.
  profile-name: RobotMC
  profile-key: robotmc
  version-id: RobotMC
  game-directory-name: robotmc
  profile-icon: Redstone_Block
  minecraft:
    version: '26.3'
  mod:
    loader:
      type: fabric
      # 26.3용 Fabric Loader stable.
      version: '0.19.5'
    mods:
      # 요청한 모드의 Modrinth required 의존성. 선택 의존성은 넣지 않는다.
      # GeckoLib은 The Sift 페이지가 가리키는 버전이 NeoForge jar라 Fabric 5.5.7을 쓴다.
      - download-url: 'https://cdn.modrinth.com/data/P7dR8mSH/versions/v2j28coa/fabric-api-0.162.0+26.3.jar'
      - download-url: 'https://cdn.modrinth.com/data/8BmcQJ2H/versions/kSxHvs99/geckolib-fabric-26.3-5.5.7.jar'
      - download-url: 'https://cdn.modrinth.com/data/9s6osm5g/versions/fg2uyxOW/cloth-config-fabric-26.3.159.jar'
      - download-url: 'https://cdn.modrinth.com/data/lhGA9TYQ/versions/1pMaB6So/architectury-fabric-22.0.5.jar'
      - download-url: 'https://cdn.modrinth.com/data/j0IfTxBq/versions/QK8RaspH/mielon''s-the-sift-1.1.2-mc26.3-fabric.jar'
      - download-url: 'https://cdn.modrinth.com/data/nfn13YXA/versions/rKsAE6bX/RoughlyEnoughItems-26.3.824.jar'
      - download-url: 'https://cdn.modrinth.com/data/YL57xq9U/versions/vTN4NRGW/iris-fabric-1.11.7+mc26.3.jar'
      - download-url: 'https://cdn.modrinth.com/data/AANobbMI/versions/bAZQdGpg/sodium-fabric-0.9.2+mc26.3.jar'
      - download-url: 'https://cdn.modrinth.com/data/NcUtCpym/versions/nz9xjzWi/xaeroworldmap-fabric-26.3-1.47.0.jar'
      - download-url: 'https://cdn.modrinth.com/data/1bokaNcj/versions/B2aG1aya/xaerominimap-fabric-26.3-26.6.0.jar'
  servers:
    - ip: minecraft.o-r.cc
      name: Robot Server
  resource-packs:
    - download-url: 'https://cdn.modrinth.com/data/r4GILswZ/versions/vyty9ijM/Faithful 64x - December 2025 Release.zip'
