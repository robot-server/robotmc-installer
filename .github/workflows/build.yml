name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

  release:
    name: release
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Require an exact release tag
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          if [[ ! "$ref" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "A release jar is uploaded only for an exact v<major>.<minor>.<patch> tag."
            exit 1
          fi

      - name: Build the bootJar
        run: ./gradlew bootJar --console=plain -PreleaseRef="${GITHUB_REF_NAME}"

      - name: Upload the jar to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < build/generated/installer-version/installer-version.txt)"
          expected="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$expected" ]]; then
            echo "Gradle version '${version}' is not '${expected}'."
            exit 1
          fi
          jar="build/libs/robotmc-installer-${version}.jar"
          if [[ ! -f "$jar" ]]; then
            echo "Missing ${jar}."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$jar" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "bootJar ${version}."
          fi

  release-windows:
    name: release-windows
    needs: release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Require an exact release tag
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          if [[ ! "$ref" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "A Windows SFX is uploaded only for an exact v<major>.<minor>.<patch> tag."
            exit 1
          fi

      - name: Build the Windows app image and pack one 7-Zip SFX
        shell: bash
        run: ./gradlew packageInstallerAppImage packageWindowsSfx --console=plain -PreleaseRef="${GITHUB_REF_NAME}"

      - name: Upload the exe to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < build/generated/installer-version/installer-version.txt)"
          expected="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$expected" ]]; then
            echo "Gradle version '${version}' is not '${expected}'."
            exit 1
          fi
          exe="build/windows-sfx/robotmc-installer-${version}.exe"
          if [[ ! -f "$exe" ]]; then
            echo "Missing ${exe}."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "$exe" --clobber
